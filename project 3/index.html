<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="author" content="Andrea Gonzalez" />
    <title>Astronomy Adventure</title>
	<link rel="icon" type="images/favicon.png" href="favicon.png">
    <link rel="stylesheet" href="style.css">

   
</head>

<body>

  
    <header class="navbar">

        <div class="logo">
           <a href="index.html">
					<img src="images/logo.png" alt="logo image">
				</a>
        </div>

        <nav>
            <a href="index.html">Home</a>
			<a href="contact.html">Contact Us</a>
			<a href="constellation.html">Constellations</a>
			<a href="planet.html">Planets</a>
			<a href="star.html">Stars</a>
        </nav>

    </header>


    <main>

        <section class="mainimage" id="mainimage">

            <div class="mainimagecontent">

                <h1>
                    YOUR JOURNEY<br>
                    STARTS HERE
                </h1>

                <button class="primary-button" id="learnMoreBtn">
                    Join to learn more
                </button>

            </div>

        </section>


      
        <section class="space-section" id="discover">

            <div class="space-title">
                <h2>
                    GALAXIES.<br>
                    STARS.<br>
                    PLANETS.
                </h2>
            </div>


           


           
            <div class="fact-grid">
                <a href="planet.html" class="fact">
					<img src="images/planet.png" alt="Planet option">
					<p>Planets</p>
				</a>
            

            
                <a href="star.html" class="fact">
					<img src="images/stars.png" alt="Star option">
					<p>Stars</p>
				</a>
            </div>

        </section>


     
        <section class="signup-section" id="signup">

            <div class="signup-content">

               
                <div class="signup-info">

                    <h2>
                        SIGN UP/<br>
                        LOGIN
                    </h2>

                    <p>
                        Create an account or log in to dive into the
                        stars and wonders of our galaxy!
                    </p>


                    

                </div>


            
                <div class="form-container">

                    <form id="signupForm">

                        <div class="form-group">
                            <label for="name">Name</label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                              
                            >
                        </div>


                        <div class="form-group">
                            <label for="email">Email</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                               
                            >
                        </div>


                        <div class="form-group">
                            <label for="birthday">Birthday</label>

                            <input
                                type="date"
                                id="birthday"
                                name="birthday"
                            >
                        </div>


                        <button
                            type="submit"
                            class="submit-button"
                        >
                            Submit
                        </button>

                        

                    </form>

                </div>

            </div>


         
            <div class="social-links">

                <a href="#" aria-label="facebook">
                    <img src="images/facebook.png" alt="facebook option">
                </a>

                <a href="#" aria-label="X">
                    X
                </a>

                <a href="#" aria-label="Instagram">
                    <img src="images/instagram.png" alt="instagram option"> 
                </a>

            </div>

        </section>

    </main>


    <footer class="footer">

    <div class="footer-bottom">
        <p>&copy; 2026 Astronomy Adventure · Made for exploring the universe</p>
    </div>
</footer>

</body>
</html>
