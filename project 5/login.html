
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="author" content="Andrea Gonzalez" />
    <title>Astronomy Adventure</title>
	<link rel="icon" type="favicon.png" href="images/favicon.png">
    <link rel="stylesheet" href="style.css">
	<script type="module" src="js/auth.js"></script>
</head>

<body>

    <header class="navbar">

        <div class="logo">
           <a href="index.html">
					<img src="images/logo.png" alt="logo image">
				</a>
        </div>

        <nav>
            <a href="index.html">Home</a>
			<a href="contact.html">Contact Us</a>
			<a href="constellation.html">Constellations</a>
			<a href="twoStep.html">Explore Universe</a>
			<a href="login.html">Sign Up / Login</a>
        </nav>

    </header>

    <main class="login-container">

        <h1>Astronomy Adventure</h1>
        <h2 id="form-title">Login to Your Account</h2>

        <p id="form-description">
            Welcome back! Enter your email and password.
        </p>

        <div id="auth-message" role="status" aria-live="polite"></div>

        <form id="login-form">

            <label for="login-email">Email Address</label>
            <input
                type="email"
                id="login-email"
                required
                autocomplete="email"
            >

            <label for="login-password">Password</label>
            <input
                type="password"
                id="login-password"
                required
                autocomplete="current-password"
            >

            <button type="submit" id="login-button">
                Log In
            </button>

        </form>

        <form id="signup-form" hidden>

            <label for="signup-email">Email Address</label>
            <input
                type="email"
                id="signup-email"
                required
                autocomplete="email"
            >

            <label for="signup-password">Create Password</label>
            <input
                type="password"
                id="signup-password"
                minlength="6"
                required
                autocomplete="new-password"
            >

            <button type="submit" id="signup-button">
                Create Account
            </button>

        </form>

		
<div class="google-divider">
    <span>OR</span>
</div>

<button type="button" id="google-login-button">
    Continue with Google
</button>


        <p id="switch-text">
            Don't have an account?
            <button type="button" id="show-signup">
                Sign Up
            </button>
        </p>

        <button type="button" id="logout-button" hidden>
            Log Out
        </button>

    </main>

</body>
</html>
